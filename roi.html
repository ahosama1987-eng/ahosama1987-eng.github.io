<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:type" content="website">
  <meta property="og:title" content="ROI Calculator | Pro Calculator Hub">
  <meta property="og:description" content="Calculate ROI percentage quickly.">
  <meta property="og:url" content="https://ahosama1987-eng.github.io/roi.html">

  <link rel="stylesheet" href="css/styles.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "ROI Calculator",
    "url": "https://ahosama1987-eng.github.io/roi.html",
    "inLanguage": "en",
    "isPartOf": {
      "@type": "WebSite",
      "name": "Pro Calculator Hub",
      "url": "https://ahosama1987-eng.github.io/"

  }

</head>
<body>
  <div class="layout">
    <nav class="sidebar" aria-label="Tools navigation">
      <h2>Tools</h2>
      <div class="nav">
        <a href="index.html">🏠 Home</a>
        <a href="loan.html">💰 Loan</a>
        <a href="profit.html">📈 Profit</a>
        <a href="roi.html">🎯 ROI</a>
        <a href="bmi.html">⚖️ BMI</a>
        <a href="age.html">🎂 Age</a>
        <a href="tax.html">🧾 Tax</a>
      </div>
    </nav>

    <div class="main">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <h1>ROI Calculator</h1>
            <p>Return on investment percentage</p>
          </div>
          <div class="controls">
            <a class="btn" href="ar/roi.html" hreflang="ar" lang="ar" aria-label="Switch to Arabic">العربية</a>
            <button class="btn" id="themeToggle" type="button">Theme: Auto</button>
          </div>
        </div>
      </header>

      <main class="content">
        <section class="card">
          <h2>Calculate ROI</h2>
          <p>Enter the investment amount and the return value.</p>

          <form id="roiForm">
            <label for="invest">Investment</label>
            <input id="invest" type="number" inputmode="decimal" step="0.01" placeholder="e.g., 1000" required>

            <label for="returnVal">Return</label>
            <input id="returnVal" type="number" inputmode="decimal" step="0.01" placeholder="e.g., 1250" required>

            <button class="btn primary" type="submit">Calculate</button>
          </form>

          <div class="result" id="roiResult" aria-live="polite"></div>
        </section>
      </main>

      <footer>
        <a href="index.html">Back to home</a>
      </footer>
    </div>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
